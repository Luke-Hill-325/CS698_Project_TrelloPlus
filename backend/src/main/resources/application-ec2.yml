server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

spring:
  application:
    name: flowboard-backend
  datasource:
    url: jdbc:sqlite:/opt/flowboard/data/flowboard.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.flowboard: INFO
    org.springframework.security: WARN

jwt:
  secret: ${JWT_SECRET:change-this-in-production-with-min-32-characters}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

ai:
  mock-enabled: ${AI_MOCK_ENABLED:true}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}
