# Lambda-specific configuration for FlowBoard Backend
# This profile is activated when running on AWS Lambda

spring:
  application:
    name: flowboard-backend-lambda
  
  # Database configuration optimized for Lambda
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Lambda-specific connection pool settings
      # Keep minimal since Lambda is ephemeral
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 10000
      max-lifetime: 55000
      auto-commit: true
      
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        # Optimize for short-lived connections
        connection.handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT
        format_sql: false
        show_sql: false
        # Batch operations for better performance
        jdbc.batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
    
  # Flyway disabled in Lambda - run migrations separately (e.g., via CI/CD or ECS task)
  flyway:
    enabled: false
    
  # WebSocket is disabled for Lambda deployment
  # Real-time features should be implemented via polling on frontend

# Logging configuration for Lambda (CloudWatch)
logging:
  level:
    root: INFO
    com.flowboard: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server configuration (not used in Lambda but required for Spring Boot)
server:
  port: 8080
  servlet:
    context-path: /api/v1

# CORS configuration - set via environment variable
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 hours in milliseconds

# AI Configuration (mock mode for Lambda - externalize LLM calls)
ai:
  mock-enabled: ${AI_MOCK_ENABLED:true}
  openai:
    api-key: ${OPENAI_API_KEY:mock-key}
    model: ${OPENAI_MODEL:gpt-4-1106-preview}

# Management endpoints (health checks for Lambda)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
